<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar — The Learning Loft of Elk Grove</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="256x256" href="/images/favicon-256.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180.png">
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body class="admin-body">

  <div id="portalApp" style="display:none">

    <header class="admin-topbar">
      <div class="admin-topbar__inner">
        <div class="admin-topbar__brand">
          <img src="/images/horizontal-nav-logo-soft-web-transparent.png" alt="The Learning Loft" class="admin-topbar__logo">
          <span class="admin-topbar__badge">Parent Portal</span>
        </div>
        <div class="admin-topbar__right">
          <span id="portalUserEmail" class="admin-topbar__user"></span>
          <button id="logoutBtn" class="admin-topbar__logout">Sign Out</button>
        </div>
      </div>
    </header>

    <main class="portal-main">
      <a href="/portal/" class="portal-back">&larr; Back to Dashboard</a>

      <p class="eyebrow">Parent Portal</p>
      <h1 style="font-family:var(--font-head); font-size:2rem; margin-bottom:.5rem;">Calendar</h1>
      <p style="color:var(--text-body); max-width:60ch; margin-bottom:2rem;">
        Important dates, closures, and events for the school year.
      </p>

      <div id="calendarCard" class="portal-card">
        <div id="calendarContent">
          <p class="admin-empty">Loading…</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const { createClient } = window.supabase;
    const sb = createClient(
      'https://otmuflfpogtpkzqrclmm.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90bXVmbGZwb2d0cGt6cXJjbG1tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MzA1NTQsImV4cCI6MjA5OTIwNjU1NH0._FBPP-VskInqSNHaUQLOZmwWWcFf1ERHwMCB5_KcJ0Y'
    );

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    sb.auth.onAuthStateChange((event, session) => {
      if (session) {
        document.getElementById('portalApp').style.display = 'block';
        document.getElementById('portalUserEmail').textContent = session.user.email;
        loadCalendar();
      } else {
        // This page assumes a signed-in session; send anyone without one
        // back to the main portal, which owns the login/invite screens.
        window.location.replace('/portal/');
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => sb.auth.signOut());

    function formatFileSize(bytes) {
      if (!bytes) return '';
      if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    async function loadCalendar() {
      const content = document.getElementById('calendarContent');
      const { data, error } = await sb
        .from('calendar_document')
        .select('*')
        .order('updated_at', { ascending: false })
        .limit(1);

      if (error) {
        content.innerHTML = '<p class="admin-empty">Something went wrong loading the calendar. Please refresh.</p>';
        return;
      }
      const doc = data && data[0];
      if (!doc) {
        content.innerHTML = '<p class="admin-empty">No calendar posted yet — check back soon!</p>';
        return;
      }

      // Signed once up front so the same URL backs both the embedded
      // viewer and the "Open in new tab" fallback — an hour is plenty
      // for a single page view.
      const { data: signed, error: signError } = await sb.storage.from('calendar').createSignedUrl(doc.storage_path, 3600);
      if (signError || !signed?.signedUrl) {
        content.innerHTML = '<p class="admin-empty">Something went wrong loading the calendar. Please refresh.</p>';
        return;
      }

      // #toolbar=0&navpanes=0&scrollbar=0 asks the browser's built-in PDF
      // viewer to drop its own toolbar/thumbnail sidebar so the embed looks
      // like part of the page instead of a chrome-y app window. Chrome and
      // Firefox mostly honor it; Safari's viewer may ignore it and show its
      // own controls anyway — the "Open in new tab" link is the fallback.
      const embedUrl = signed.signedUrl + '#toolbar=0&navpanes=0&scrollbar=0';

      content.innerHTML = `
        <div style="display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; margin-bottom:1rem;">
          <div>
            <strong>${esc(doc.file_name)}</strong>
            <span style="color:var(--text-muted); font-size:.85rem; margin-left:.5rem;">${formatFileSize(doc.file_size)}</span>
          </div>
          <a class="btn btn--outline" href="${esc(signed.signedUrl)}" target="_blank" rel="noopener" style="flex-shrink:0;">Open in new tab &rarr;</a>
        </div>
        <iframe src="${esc(embedUrl)}" title="Program calendar" style="width:100%; height:80vh; min-height:480px; border:1px solid var(--border); border-radius:var(--r-md); background:var(--white-warm);"></iframe>
        <p style="margin-top:.75rem; font-size:.8rem; color:var(--text-muted);">Not loading? <a href="${esc(signed.signedUrl)}" target="_blank" rel="noopener">Open it in a new tab instead</a>.</p>
      `;
    }
  </script>
</body>
</html>
