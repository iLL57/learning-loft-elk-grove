<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documents — The Learning Loft of Elk Grove</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="256x256" href="/images/favicon-256.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180.png">
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body class="admin-body">

  <div id="portalApp" style="display:none">

    <header class="admin-topbar">
      <div class="admin-topbar__inner">
        <div class="admin-topbar__brand">
          <img src="/images/horizontal-nav-logo-soft-web-transparent.png" alt="The Learning Loft" class="admin-topbar__logo">
          <span class="admin-topbar__badge">Parent Portal</span>
        </div>
        <div class="admin-topbar__right">
          <span id="portalUserEmail" class="admin-topbar__user"></span>
          <button id="logoutBtn" class="admin-topbar__logout">Sign Out</button>
        </div>
      </div>
    </header>

    <main class="portal-main">
      <a href="/portal/" class="portal-back">&larr; Back to Dashboard</a>

      <p class="eyebrow">Parent Portal</p>
      <h1 style="font-family:var(--font-head); font-size:2rem; margin-bottom:.5rem;">Documents</h1>
      <p style="color:var(--text-body); max-width:60ch; margin-bottom:2rem;">
        The parent handbook, policies, and program forms. Each opens in a new tab.
      </p>

      <div id="documentCard" class="portal-card">
        <div id="documentList">
          <p class="admin-empty">Loading…</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const { createClient } = window.supabase;
    const sb = createClient(
      'https://otmuflfpogtpkzqrclmm.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90bXVmbGZwb2d0cGt6cXJjbG1tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MzA1NTQsImV4cCI6MjA5OTIwNjU1NH0._FBPP-VskInqSNHaUQLOZmwWWcFf1ERHwMCB5_KcJ0Y'
    );

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    sb.auth.onAuthStateChange((event, session) => {
      if (session) {
        document.getElementById('portalApp').style.display = 'block';
        document.getElementById('portalUserEmail').textContent = session.user.email;
        loadDocuments();
      } else {
        // This page assumes a signed-in session; send anyone without one
        // back to the main portal, which owns the login/invite screens.
        window.location.replace('/portal/');
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => sb.auth.signOut());

    async function openDocument(path, btn) {
      const originalText = btn.textContent;
      btn.textContent = 'Opening…'; btn.disabled = true;
      const { data, error } = await sb.storage.from('documents').createSignedUrl(path, 3600);
      btn.textContent = originalText; btn.disabled = false;
      if (error || !data?.signedUrl) {
        alert('Could not open that document. Please try again, or email info@thelearninglofteg.com.');
        return;
      }
      window.open(data.signedUrl, '_blank', 'noopener');
    }

    async function loadDocuments() {
      const list = document.getElementById('documentList');
      const { data: documents, error } = await sb
        .from('documents')
        .select('*')
        .eq('published', true)
        .order('category', { ascending: true, nullsFirst: false })
        .order('title', { ascending: true });

      if (error) {
        list.innerHTML = '<p class="admin-empty">Something went wrong loading documents. Please refresh.</p>';
        return;
      }
      if (!documents || !documents.length) {
        list.innerHTML = '<p class="admin-empty">No documents yet — check back soon!</p>';
        return;
      }

      list.innerHTML = documents.map((d, i) => `
        <div class="portal-doc-row" style="${i > 0 ? 'border-top:1px solid var(--border);' : ''}">
          <div class="portal-doc-row__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <path d="M14 2v6h6"/>
            </svg>
          </div>
          <div class="portal-doc-row__info">
            <strong>${esc(d.title)}</strong>
            ${d.category ? `<span class="portal-doc-row__category">${esc(d.category)}</span>` : ''}
          </div>
          <button class="btn btn--outline open-document" data-path="${esc(d.storage_path)}" style="flex-shrink:0;">View &rarr;</button>
        </div>
      `).join('');

      list.querySelectorAll('.open-document').forEach(btn => {
        btn.addEventListener('click', () => openDocument(btn.dataset.path, btn));
      });
    }
  </script>
</body>
</html>
