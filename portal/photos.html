<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Albums — The Learning Loft of Elk Grove</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="256x256" href="/images/favicon-256.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180.png">
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body class="admin-body">

  <div id="portalApp" style="display:none">

    <header class="admin-topbar">
      <div class="admin-topbar__inner">
        <div class="admin-topbar__brand">
          <img src="/images/horizontal-nav-logo-soft-web-transparent.png" alt="The Learning Loft" class="admin-topbar__logo">
          <span class="admin-topbar__badge">Parent Portal</span>
        </div>
        <div class="admin-topbar__right">
          <span id="portalUserEmail" class="admin-topbar__user"></span>
          <button id="logoutBtn" class="admin-topbar__logout">Sign Out</button>
        </div>
      </div>
    </header>

    <main class="portal-main">
      <a href="/portal/" class="portal-back">&larr; Back to Dashboard</a>

      <p class="eyebrow">Parent Portal</p>
      <h1 style="font-family:var(--font-head); font-size:2rem; margin-bottom:.5rem;">Photo Albums</h1>
      <p style="color:var(--text-body); max-width:60ch; margin-bottom:2rem;">
        Monthly photos from the program, hosted on Google Drive. Each album opens in a new tab.
      </p>

      <div id="albumGrid" class="album-grid">
        <p class="admin-empty">Loading…</p>
      </div>
    </main>
  </div>

  <script>
    const { createClient } = window.supabase;
    const sb = createClient(
      'https://otmuflfpogtpkzqrclmm.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90bXVmbGZwb2d0cGt6cXJjbG1tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MzA1NTQsImV4cCI6MjA5OTIwNjU1NH0._FBPP-VskInqSNHaUQLOZmwWWcFf1ERHwMCB5_KcJ0Y'
    );

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function monthLabel(dateStr) {
      const [y, m] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }

    sb.auth.onAuthStateChange((event, session) => {
      if (session) {
        document.getElementById('portalApp').style.display = 'block';
        document.getElementById('portalUserEmail').textContent = session.user.email;
        loadAlbums();
      } else {
        // This page assumes a signed-in session; send anyone without one
        // back to the main portal, which owns the login/invite screens.
        window.location.replace('/portal/');
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => sb.auth.signOut());

    // A monthly album's label comes from its month; a standing (non-monthly)
    // album carries its own title instead.
    function albumLabel(a) {
      return a.month ? monthLabel(a.month) : a.title;
    }

    async function loadAlbums() {
      const grid = document.getElementById('albumGrid');
      // Standing (no-month) albums first, then monthly albums newest-first.
      const { data: albums, error } = await sb
        .from('photo_albums')
        .select('*')
        .eq('published', true)
        .order('month', { ascending: false, nullsFirst: true });

      if (error) {
        grid.innerHTML = '<p class="admin-empty">Something went wrong loading albums. Please refresh.</p>';
        return;
      }
      if (!albums || !albums.length) {
        grid.innerHTML = '<p class="admin-empty">No albums yet — check back soon!</p>';
        return;
      }

      grid.innerHTML = albums.map(a => `
        <div class="album-card">
          <div class="album-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21"/>
            </svg>
          </div>
          <h4>${esc(albumLabel(a))}</h4>
          <a class="btn btn--green" href="${esc(a.drive_url)}" target="_blank" rel="noopener" style="align-self:flex-start;">View Photos &rarr;</a>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
